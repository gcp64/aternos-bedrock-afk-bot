name: 24/7 Bedrock AFK Guardian

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: aternos-afk-bot-guardian
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Bedrock AFK Bot Guardian & Auto-Loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting AFK Bot on GitHub Cloud..."
          node bot.js &
          BOT_PID=$!
          
          # Stay online guarding the server for 3 hours and 55 minutes
          sleep 14100
          
          echo "Guarding cycle complete. Stopping current bot gracefully before next cycle..."
          kill $BOT_PID || true
          sleep 5
          
          echo "Triggering next continuous cycle..."
          gh workflow run afk_bot_24_7.yml || true
